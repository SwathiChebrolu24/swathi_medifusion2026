<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediFusion - Lab Dashboard</title>
    <meta name="description" content="MediFusion Lab Technician Dashboard - Manage test orders and results">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #060b1f;
            --surface: #0d1535;
            --surface2: #111a3a;
            --border: rgba(255,255,255,0.07);
            --teal: #00d4aa;
            --teal-dim: rgba(0,212,170,0.12);
            --purple: #7c6bff;
            --purple-dim: rgba(124,107,255,0.12);
            --orange: #ff8c42;
            --orange-dim: rgba(255,140,66,0.12);
            --text: #e4e9f2;
            --text-muted: rgba(228,233,242,0.55);
            --radius: 16px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 28px 0;
            position: fixed;
            top: 0; left: 0;
            height: 100vh;
            z-index: 100;
        }

        .logo {
            padding: 0 24px 28px;
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--teal);
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 24px;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 0;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 500;
            border-left: 3px solid transparent;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--teal-dim);
            color: var(--teal);
            border-left-color: var(--teal);
        }

        .nav-icon { font-size: 18px; width: 24px; text-align: center; }

        .sidebar-footer {
            margin-top: auto;
            padding: 20px 24px;
            border-top: 1px solid var(--border);
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--teal), var(--purple));
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px;
        }

        .user-info .name { font-size: 13px; font-weight: 600; }
        .user-info .role { font-size: 11px; color: var(--text-muted); }

        /* ── Main Content ── */
        .main {
            margin-left: 260px;
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 700;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-danger {
            background: rgba(255,80,80,0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255,80,80,0.3);
        }
        .btn-danger:hover { background: rgba(255,80,80,0.25); }

        /* ── Stats Cards ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); }

        .stat-icon {
            width: 52px; height: 52px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
        }

        .stat-icon.teal { background: var(--teal-dim); }
        .stat-icon.purple { background: var(--purple-dim); }
        .stat-icon.orange { background: var(--orange-dim); }

        .stat-num { font-size: 28px; font-weight: 800; }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        /* ── Section ── */
        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: var(--teal-dim);
            color: var(--teal);
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 600;
        }

        /* ── Test Orders Table ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 28px;
        }

        .card-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 12px 20px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 15px 20px;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-pending { background: rgba(255,193,7,0.15); color: #ffc107; }
        .status-scheduled { background: rgba(0,212,170,0.15); color: var(--teal); }
        .status-completed { background: rgba(124,107,255,0.15); color: var(--purple); }
        .status-in_progress { background: rgba(255,140,66,0.15); color: var(--orange); }

        .action-btn {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--teal);
            background: var(--teal-dim);
            color: var(--teal);
            transition: all 0.2s;
        }
        .action-btn:hover { background: var(--teal); color: var(--bg); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

        /* ── Loading spinner ── */
        .spinner {
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--teal);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 28px; right: 28px;
            background: var(--surface2);
            border: 1px solid var(--teal);
            color: var(--text);
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">🧪 MediFusion</div>
        <nav>
            <div class="nav-item active" onclick="showSection('pending')">
                <span class="nav-icon">🧾</span> Pending Tests
            </div>
            <div class="nav-item" onclick="showSection('scheduled')">
                <span class="nav-icon">📅</span> Scheduled
            </div>
            <div class="nav-item" onclick="showSection('completed')">
                <span class="nav-icon">✅</span> Completed
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="user-chip">
                <div class="user-avatar" id="avatarText">?</div>
                <div class="user-info">
                    <div class="name" id="sidebarName">Loading...</div>
                    <div class="role">Lab Technician</div>
                </div>
            </div>
            <button class="btn btn-danger" style="width:100%;margin-top:14px;" onclick="logout()">
                Sign Out
            </button>
        </div>
    </aside>

    <!-- Main -->
    <main class="main">
        <div class="header">
            <div>
                <h1>Lab Dashboard</h1>
                <p style="color:var(--text-muted);font-size:14px;margin-top:4px;">
                    Manage test orders and upload results
                </p>
            </div>
            <button class="btn" style="background:var(--teal-dim);color:var(--teal);border:1px solid rgba(0,212,170,0.3);" onclick="loadCases()">
                🔄 Refresh
            </button>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon teal">🧾</div>
                <div>
                    <div class="stat-num" id="statPending">–</div>
                    <div class="stat-label">Pending Tests</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">📅</div>
                <div>
                    <div class="stat-num" id="statScheduled">–</div>
                    <div class="stat-label">Scheduled</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple">✅</div>
                <div>
                    <div class="stat-num" id="statCompleted">–</div>
                    <div class="stat-label">Completed</div>
                </div>
            </div>
        </div>

        <!-- Test Orders Table -->
        <div id="sectionPending">
            <div class="section-title">
                🧾 Pending Test Orders
                <span class="badge" id="pendingCount">0</span>
            </div>
            <div class="card">
                <div id="pendingTableContainer">
                    <div class="empty-state">
                        <div class="spinner"></div>
                        <p style="margin-top:12px;">Loading test orders...</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="sectionScheduled" style="display:none;">
            <div class="section-title">
                📅 Scheduled Tests
                <span class="badge" id="scheduledCount">0</span>
            </div>
            <div class="card">
                <div id="scheduledTableContainer">
                    <div class="empty-state">
                        <div class="spinner"></div>
                        <p style="margin-top:12px;">Loading...</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="sectionCompleted" style="display:none;">
            <div class="section-title">
                ✅ Completed Tests
                <span class="badge" id="completedCount">0</span>
            </div>
            <div class="card">
                <div id="completedTableContainer">
                    <div class="empty-state">
                        <div class="spinner"></div>
                        <p style="margin-top:12px;">Loading...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="config.js"></script>
    <script>
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user") || "{}");

        // Auth guard
        if (!token || user.role !== "lab") {
            alert("Access denied. Please login as a Lab Technician.");
            window.location.href = "login.html";
        }

        // Set user info in sidebar
        document.getElementById("sidebarName").textContent = user.full_name || user.username || "Lab Tech";
        document.getElementById("avatarText").textContent = (user.full_name || user.username || "L")[0].toUpperCase();

        let allCases = [];

        function showSection(section) {
            ["pending", "scheduled", "completed"].forEach(s => {
                document.getElementById("section" + s.charAt(0).toUpperCase() + s.slice(1)).style.display = "none";
                document.querySelectorAll(".nav-item").forEach((el, i) => {
                    el.classList.toggle("active", ["pending","scheduled","completed"][i] === section);
                });
            });
            document.getElementById("section" + section.charAt(0).toUpperCase() + section.slice(1)).style.display = "block";
        }

        function showToast(msg, success = true) {
            const t = document.getElementById("toast");
            t.textContent = (success ? "✅ " : "❌ ") + msg;
            t.style.borderColor = success ? "var(--teal)" : "#ff6b6b";
            t.style.display = "block";
            setTimeout(() => t.style.display = "none", 3000);
        }

        function buildTable(cases, type) {
            if (!cases.length) {
                return `<div class="empty-state"><div class="icon">🧪</div><p>No ${type} tests found.</p></div>`;
            }
            return `<table>
                <thead>
                    <tr>
                        <th>Patient Name</th>
                        <th>Test Type</th>
                        <th>Status</th>
                        <th>Scheduled Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    ${cases.map(c => `
                        <tr>
                            <td><strong>${c.patient_name}</strong></td>
                            <td>${c.ordered_test_type || "N/A"}</td>
                            <td><span class="status-badge status-${c.test_status}">${c.test_status}</span></td>
                            <td>${c.scheduled_date ? new Date(c.scheduled_date).toLocaleDateString() : "–"}</td>
                            <td>
                                ${c.test_status === "scheduled" ? `
                                    <button class="action-btn" onclick="markComplete(${c.id})">Mark Complete</button>
                                ` : c.test_status === "pending" ? `
                                    <span style="color:var(--text-muted);font-size:12px;">Awaiting schedule</span>
                                ` : `
                                    <span style="color:var(--text-muted);font-size:12px;">Done</span>
                                `}
                            </td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>`;
        }

        async function loadCases() {
            try {
                // Lab tech sees all cases that have tests ordered
                const res = await fetch(`${API_BASE_URL}/admin/stats`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                // For now show a message since the lab endpoint isn't fully built
                const pending = allCases.filter(c => c.test_status === "pending");
                const scheduled = allCases.filter(c => c.test_status === "scheduled");
                const completed = allCases.filter(c => c.test_status === "completed");

                document.getElementById("statPending").textContent = pending.length;
                document.getElementById("statScheduled").textContent = scheduled.length;
                document.getElementById("statCompleted").textContent = completed.length;

                document.getElementById("pendingCount").textContent = pending.length;
                document.getElementById("scheduledCount").textContent = scheduled.length;
                document.getElementById("completedCount").textContent = completed.length;

                document.getElementById("pendingTableContainer").innerHTML = buildTable(pending, "pending");
                document.getElementById("scheduledTableContainer").innerHTML = buildTable(scheduled, "scheduled");
                document.getElementById("completedTableContainer").innerHTML = buildTable(completed, "completed");

            } catch (err) {
                console.error(err);
                document.getElementById("pendingTableContainer").innerHTML =
                    `<div class="empty-state"><div class="icon">⚠️</div><p>Error loading data. Please refresh.</p></div>`;
            }
        }

        async function markComplete(caseId) {
            // Future: POST to /lab/cases/{id}/complete
            showToast("Test marked as complete! (API integration pending)", true);
        }

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        // Init
        loadCases();
    </script>
</body>

</html>
